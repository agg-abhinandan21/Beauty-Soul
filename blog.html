<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <!-- Header Load -->
    <div id="header"></div>

    <!-- Blog Content -->
    <main style="padding: 20px;">
        <h1>My Blog</h1>
        <p>
            Ye mera blog page ka content hai.  
            Yahan tum apna article, image, ya SEO content likh sakte ho.
        </p>
    </main>

    <!-- Footer Load -->
    <div id="footer"></div>

    <!-- Header Script -->
    <script>
        fetch("header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
        });
    </script>

    <!-- Footer Script -->
    <script>
        fetch("footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
    </script>

</body>
</html>
